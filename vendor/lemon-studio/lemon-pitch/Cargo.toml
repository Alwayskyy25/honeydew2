[package]
name = "lemon-pitch"
description = "Lemon Pitch: a Newtone-style vocal pitch editor instrument for Lemon Studio / Honeydew, written from scratch"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
doctest = false

[features]
# Compiled into Lemon Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []
# Honeydew (vendored addition): the editor draws into Honeydew's own window (`os-plugkit`'s `embed`).
embed = ["os-plugkit/embed", "os-hostlink/embed"]

[dependencies]
nih_plug = { path = "../../nih-plug" }
os-engine = { path = "../os-engine", features = ["plugins"] }
os-dsp = { path = "../os-dsp" }
os-hostlink = { path = "../os-hostlink" }
os-plugkit = { path = "../os-plugkit" }
os-ui = { path = "../os-ui" }
os-theme = { path = "../os-theme" }
# The open sample dialog: rfd's, or Honeydew's own picker where it answers (`host-rfd`).
rfd = { package = "host-rfd", path = "../host-rfd" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader"] }

[lints.rust]
unknown_lints = "allow"
dead_code = "allow"
